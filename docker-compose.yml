version: "3.9"

services:
  api:
    build: .
    container_name: chatterstack-api
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=development
      - POSTGRES_DSN=${POSTGRES_DSN}
      - REDIS_ADDR=redis:6379
      - JWT_ACCESS_SECRET=change-me
      - JWT_REFRESH_SECRET=change-me
    depends_on:
      - postgres
      - redis

  websocket:
    build: .
    container_name: chatterstack-websocket
    command: ["--mode", "websocket"]
    ports:
      - "9090:8080"
    environment:
      - APP_ENV=development
      - POSTGRES_DSN=${POSTGRES_DSN}
      - REDIS_ADDR=redis:6379
      - JWT_ACCESS_SECRET=change-me
      - JWT_REFRESH_SECRET=change-me
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: chatterstack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatterstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-chatterstack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatterstack-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
